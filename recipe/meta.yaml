{% set name = "mmh3" %}
{% set version = "5.3.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/hajimes/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 13421810022f5dab96f482ba085582c8e3ebb2be09182754f682473efd1009fd

build:
  number: 0
  skip: True # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-build-isolation --no-cache-dir -vvv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - mmh3
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -vv tests

about:
  home: https://github.com/hajimes/mmh3
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python wrapper for MurmurHash (MurmurHash3), a set of fast and robust hash functions.
  description: |
    mmh3 is a Python wrapper for MurmurHash (MurmurHash3), a set of fast 
    and robust non-cryptographic hash functions invented by Austin Appleby.
  dev_url: https://github.com/hajimes/mmh3
  doc_url: https://github.com/hajimes/mmh3/blob/master/README.md
extra:
  recipe-maintainers:
    - johnlees
